<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#023926" />
    <meta name="description" content="Pesquise e compare ofertas válidas dos supermercados de Novo Hamburgo." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/style.css" />
    <style>
      .flyer-intro {
        box-sizing: border-box;
        width: calc(100% - 20px);
        max-width: 1080px;
        margin: 10px auto 0;
      }
      .flyer-intro-art {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 2183 / 720;
        object-fit: contain;
        border-radius: 16px;
      }
      #content-scroll > #flyer-list {
        margin-top: 6px;
        padding-top: 0;
      }
      #flyer-list > :first-child {
        margin-top: 0;
      }
    </style>
    <title>Meu Busca Preço</title>
      <link rel="stylesheet" href="/unisuper.css" />
      <link rel="stylesheet" href="/zoom-flutuante.css" />
      <link rel="stylesheet" href="/encarte-viewer.css" />
  <link rel="stylesheet" href="/busca-real.css">
<link rel="stylesheet" href="/dica-pagina.css">
<link rel="icon" href="/favicon.ico?v=meu-v1" sizes="16x16 32x32 48x48">
<link rel="icon" href="/icons/meu-busca-preco-favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/assets/meu-busca-preco-favicon.svg" type="image/svg+xml" sizes="any">
<link rel="apple-touch-icon" href="/icons/meu-busca-preco-apple-180.png" sizes="180x180">
<meta name="application-name" content="Meu Busca Preço">
<meta name="apple-mobile-web-app-title" content="Meu Busca Preço">
<link rel="stylesheet" href="/ofersul.css">
<link rel="stylesheet" href="/super-juca.css">
</head>
  <body>
    <header class="topbar">
      <a class="brand" href="#top" aria-label="Meu Busca Preço — página inicial">
        <img class="brand-logo" src="/assets/meu-busca-preco-logo.svg" alt="Meu Busca Preço — Economize comprando perto de casa" width="112" height="112" />
      </a>
      <button class="install-button" id="install-button" type="button">Instalar app</button>
    </header>

    <main id="top">
      <section class="search-panel">
        <label class="search-box" for="search-input">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.2"/><path d="m15.2 15.2 5 5"/></svg>
          <input aria-label="Busque o menor preço de um produto" id="search-input" type="search" placeholder="Busque o menor preço de um produto" autocomplete="off" />
          <button id="clear-search" type="button" aria-label="Limpar busca" hidden>×</button>
        </label>

        <label class="search-box neighborhood-box" for="neighborhood-filter">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 6-8 11-8 11S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>
          <select id="neighborhood-filter" aria-label="Filtre os encartes por Bairro">
            <option value="all" selected disabled hidden>Filtre os encartes por Bairro</option>
            <option value="all">Todos</option>
            <option value="Centro">Centro</option>
            <option value="Canudos">Canudos</option>
            <option value="Santo Afonso">Santo Afonso</option>
          </select>
        </label>

        
      </section>

      <h2 id="search-order-title" class="search-order-title" hidden>Menores preços primeiro</h2>

      <div class="content-scroll" id="content-scroll">
        <section class="flyer-intro" aria-label="Encontre encartes em Novo Hamburgo">
          <img class="flyer-intro-art" src="/assets/banner-encartes-moderno.png" width="2183" height="720" alt="Os melhores encartes de Novo Hamburgo, em um só lugar. PESQUISE E COMPRE PERTO DE CASA PAGANDO O MENOR PREÇO!" decoding="async" />
        </section>

      <section class="content-section offers-section" aria-labelledby="offers-title">
        <div class="section-heading">
          <div>
            <span class="eyebrow">OFERTAS DOS ENCARTES</span>
            <h2 id="offers-title">Ofertas encontradas</h2>
          </div>
          <span class="result-count" id="result-count"></span>
        </div>
        <div class="offer-grid" id="offer-grid"></div>
        <div class="empty-state" id="empty-state" hidden>
          <strong>Nenhuma oferta encontrada</strong>
          <p>Tente outro produto ou bairro.</p>
        </div>
      </section>

      <section class="flyer-list" id="flyer-list" aria-label="Encartes dos supermercados"></section>

    <footer>
      <strong>Meu Busca Preço</strong>
      <span>Ofertas claras para escolhas melhores.</span>
      <small>Preços e condições conforme os encartes. Consulte a validade de cada oferta.</small>
    </footer>
      </div>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  <script type="module" src="/dica-pagina.js"></script>
</body>
</html>
